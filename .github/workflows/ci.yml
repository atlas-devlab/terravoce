name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, tests and local demonstrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm 11.7.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.7.0'
          run_install: false
          cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Check workspace
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Run synthetic sensor demonstration
        run: pnpm demo

      - name: Run local blockchain demonstration
        run: pnpm e2e

      - name: Validate Oracle bridge digest interoperability
        run: |
          python3 -m venv services/autonomy/.venv
          services/autonomy/.venv/bin/python -m pip install -r services/autonomy/requirements.txt
          services/autonomy/.venv/bin/python -m pytest services/autonomy/tests -q

      - name: Test four replicas with node outages
        if: github.event_name == 'workflow_dispatch'
        run: |
          services/autonomy/.venv/bin/python services/autonomy/prepare.py
          docker build -f services/autonomy/Dockerfile -t terravoce-autonomy:local .
          docker build -f services/autonomy/Oracle.Dockerfile -t terravoce-oracle:local .
          AUTONOMY_PYTHON="$PWD/services/autonomy/.venv/bin/python" pnpm --filter @terravoce/contracts autonomy:e2e
